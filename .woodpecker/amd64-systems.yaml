matrix:
  SYSTEM:
    - chell
    - alex

steps:
  - name: build
    image: nixpkgs/cachix-flakes
    commands:
      - nix profile install nixpkgs#attic-client
      - export PATH=$PATH:~/.nix-profile/bin
      - cachix use vgskye
      - attic login twm https://new-attic.is-quite.gay $ATTIC_TOKEN
      - attic use skye
      - attic login twm-old https://attic.is-quite.gay $ATTIC_TOKEN
      - attic use twm-old:skye
      - nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel
      - attic push skye ./result
    environment:
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_token
      ATTIC_TOKEN:
        from_secret: attic_token
    when:
      branch: sanitary
      event: push

labels:
  platform: linux/amd64
  backend: docker