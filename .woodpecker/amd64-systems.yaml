matrix:
  SYSTEM:
    - e4mc-jp
    - e4mc-oc
    - e4mc-us
    - chell
    - alex
    - jenny

steps:
  - name: build
    image: nixpkgs/cachix-flakes
    commands:
      - cachix use vgskye
      - cachix watch-exec vgskye -- nix build .#nixosConfigurations.${SYSTEM}.config.system.build.toplevel
    environment:
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_token
    when:
      branch: sanitary
      event: push

labels:
  platform: linux/amd64
  backend: docker