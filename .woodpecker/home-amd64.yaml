steps:
  - name: build
    image: nixpkgs/cachix-flakes
    commands:
      - cachix use vgskye
      - cachix watch-exec vgskye -- nix build .#homeConfigurations.bs2k.activationPackage
    environment:
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_token
    when:
      branch: sanitary
      event: push

labels:
  platform: linux/amd64
  backend: docker