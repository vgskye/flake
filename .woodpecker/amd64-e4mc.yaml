steps:
  - name: build
    image: nixpkgs/cachix-flakes
    commands:
      - cachix use vgskye
      - cachix watch-exec vgskye -- nix build .#nixosConfigurations.e4mc-jp.config.system.build.toplevel
      - cachix watch-exec vgskye -- nix build .#nixosConfigurations.e4mc-oc.config.system.build.toplevel
      - cachix watch-exec vgskye -- nix build .#nixosConfigurations.e4mc-us.config.system.build.toplevel
    environment:
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_token
    when:
      branch: sanitary
      event: push

labels:
  platform: linux/amd64
  backend: docker